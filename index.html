<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex,nofollow">
<title>상품 단가</title>
<link rel="stylesheet" href="css/style.css?v=20260917-1">
</head>
<body>
<main>
<div class="toolbar" role="search">
<input id="search" type="search" placeholder="모델명 또는 색상 검색" aria-label="모델명 또는 색상 검색" autocomplete="off">
<select id="color" aria-label="색상 필터"><option value="">전체 색상</option></select>
<select id="sort" aria-label="정렬">
<option value="index:asc">원본 순서</option><option value="model:asc">모델명순</option>
<option value="price:asc">단가 낮은순</option><option value="price:desc">단가 높은순</option>
<option value="stock:desc">재고 많은순</option><option value="stock:asc">재고 적은순</option>
</select>
<button id="reload" type="button" onclick="location.reload()">새로고침</button>
</div>
<p id="load-message" class="load-error" role="status">상품을 불러오는 중입니다.</p>
<table id="catalog" aria-label="상품별 이미지, 단가, 사이즈별 재고" hidden>
<colgroup><col class="col-photo"><col class="col-model"><col class="col-color"><col class="col-price"><col span="7" class="col-quantity"><col class="col-total"></colgroup>
<thead><tr><th scope="col">이미지</th><th scope="col">모델</th><th scope="col">색상</th><th scope="col">단가</th><th scope="col">225</th><th scope="col">230</th><th scope="col">235</th><th scope="col">240</th><th scope="col">245</th><th scope="col">250</th><th scope="col">255</th><th scope="col">합계</th></tr></thead>
<tbody></tbody>
</table>
<p id="empty" class="empty" role="status" hidden>검색 결과가 없습니다.</p>
<noscript>상품을 보려면 브라우저의 JavaScript를 켜 주세요.</noscript>
</main>
<dialog id="zoom" aria-labelledby="zoom-name">
<div class="dialog-head"><span id="zoom-name"></span><button id="close-zoom" type="button" autofocus>닫기</button></div>
<div class="dialog-picture"><img id="zoom-image" alt="" referrerpolicy="no-referrer"><div id="zoom-error" class="dialog-error" hidden><p>이미지를 불러오지 못했습니다.</p><a id="original-link" target="_blank" rel="noopener noreferrer">원본 이미지 열기</a></div></div>
</dialog>
<script>
window.FLAMEWORKS_BUILD = '20260917-1';
const app = document.createElement('script');
app.src = 'js/app.js?t=' + Date.now();
app.onerror = () => { document.getElementById('load-message').textContent = '사이트를 불러오지 못했습니다. 새로고침해 주세요.'; };
document.body.appendChild(app);
</script>
</body>
</html>
